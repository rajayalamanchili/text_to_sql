[project]
name = "steward-backend"
version = "0.1.0"
description = "Steward Milestone 1: schema classification & policy enforcement engine"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.90.0",
    "faker>=37",
    "fastapi>=0.140.0",
    "langgraph>=1.2.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "sqlglot>=30.13.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-bdd>=8",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
